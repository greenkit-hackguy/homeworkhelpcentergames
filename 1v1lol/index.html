<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>1v1.LOL | Building Simulator, Battle Royale & Shooting Game</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="Discover 1v1, the online building simulator and third-person shooting game.">
    <meta name="keywords" content="just,build,simulator,practice,free,online,battle,royale">

    <meta property="og:title" content="1v1.LOL">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://1v1.lol/">
    <meta property="og:image" content="https://1v1.lol/splash.jpg">
    <meta property="og:description" content="Discover 1v1, the online building simulator and third-person shooting game.">

    <link rel="shortcut icon" type="image/png" href="./favicon.png?v2">
    <link rel="stylesheet" href="./css/style.css">

    <script async src="./gtag/js.js?id=UA-118283086-6"></script>
    <script src="./js/googleAnalytics.js"></script>
    <script src="./ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="./js/IronSourceRV.js"></script>
    <script src="./js/mobileRedirect.js"></script>
    <script src="./js/fullscreen.js"></script>
    <script src="./js/sdkloader/ima3.js"></script>

    <script>
        var gameLoaded = false;
        var lockedOccured = false;
        var adsVisible = false;

        window.alert = function (message) {
            console.log(message);
        };

        window.addEventListener("error", function (event) {
            console.error(
                "Resource or script error:",
                event.message || event.target?.src || event.target?.href || event.target
            );
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
            console.error("Unhandled promise rejection:", event.reason);
        });

        window.addEventListener("beforeunload", function (event) {
            if (adsVisible || !gameLoaded || !lockedOccured) return;

            var message = "Are you sure you want to leave?";
            event.preventDefault();
            event.returnValue = message;
            return message;
        });
    </script>

    <!-- Advertising support; game loading does not depend on ads. -->
    <script>
        (function (zonefile) {
            var hash = window.location.href.split("#")[0]
                .split("")
                .reduce(function (a, b) {
                    return ((a << 5) - a + b.charCodeAt(0)) >>> 1;
                }, 0);

            var key = (10 + ((hash * 7) % 26)).toString(36) + hash.toString(36);
            var api = window[key] = window[key] || {};

            function failApi() {
                var failFn = function (obj) {
                    if (obj && typeof obj === "object" && obj.fail) obj.fail();
                };

                if (Array.isArray(api.cmd)) {
                    api.cmd.forEach(failFn);
                    api.cmd.length = 0;
                }

                window.cpmstarAPI = failFn;
            }

            var script = document.createElement("script");
            var host = location.protocol === "https:" || location.protocol === "file:"
                ? "https://server"
                : "//cdn";

            if (location.hash === "#cpmstarDev") host = "//dev.server";
            if (location.hash === "#cpmstarStaging") host = "//staging.server";

            script.async = true;
            script.onerror = failApi;
            script.src = host + ".cpmstar.com/cached/zonefiles/" +
                zonefile + ".js?rnd=" + Math.round(Math.random() * 999999);

            document.head.appendChild(script);

            window.cpmstarAPI = function (obj) {
                (api.cmd = api.cmd || []).push(obj);
            };
        })("372_49986_1v1");
    </script>

    <script src="./js/cpmstar.js"></script>
</head>

<body>
    <div class="ads">
        <div class="ad-smallscreen">
            <div class="ad ad-rectangle-bottom"></div>
        </div>

        <div class="ad ad-rectangle-upper" id="adRectangleUpper">
            <script>
                (function (w, pid) {
                    var r = function (value, shift) {
                        return (10 + ((value.split("").reduce(function (a, b) {
                            return (a << 5) - a + b.charCodeAt(0) >>> shift;
                        }, 0) * 7) % 26)).toString(36);
                    };

                    w.document.write(
                        '<div style="width:300px;height:250px" class="' +
                        r(w.location.href.split("#")[0] + pid, 0) +
                        '"></div>'
                    );
                })(window, 83023);
            </script>
        </div>

        <div class="ad-largescreen">
            <div class="ad ad-leaderboard-bottom">
                <script>
                    (function (w, pid) {
                        w.document.write(
                            '<div style="width:300px;height:600px" class="ad-slot-' +
                            pid + '"></div>'
                        );
                    })(window, 85420);
                </script>
            </div>
        </div>
    </div>

    <div id="gameContainer"></div>

    <div id="loader">
        <img class="logo" src="./logo.png" alt="1v1.LOL">
        <div class="spinner"></div>
        <div class="progress">
            <div class="full"></div>
        </div>
        <p id="loaderMessage" role="status" aria-live="polite">
            Loading 1v1.LOL...
        </p>
    </div>

    <!-- ALTERNATIVE UNITY BUILD -->
    <script
        id="unity-loader"
        src="https://justbuild.nyc3.cdn.digitaloceanspaces.com/NewCI/1v1/Prod/11/3e3a3e7f9b174542bcfb0fd7615b7725/UnityLoader.js"
        onerror="window.showGameError('The alternative UnityLoader.js could not be downloaded.')">
    </script>

    <script>
        (function () {
            "use strict";

            var loader = document.getElementById("loader");
            var message = document.getElementById("loaderMessage");
            var progressBar = document.querySelector("#loader .progress");
            var spinner = document.querySelector("#loader .spinner");

            var gameInstance = null;
            var started = false;
            var loaded = false;
            var timeoutId = null;

            // Alternative build URL from the supplied alternative HTML source.
            var gameJsonUrl =
                "https://justbuild.nyc3.cdn.digitaloceanspaces.com/NewCI/1v1/Prod/11/3e3a3e7f9b174542bcfb0fd7615b7725/WebGL.json";

            window.showGameError = function (text) {
                console.error("Game loading error:", text);

                if (message) message.textContent = text;
                if (spinner) spinner.style.display = "none";
                if (progressBar) progressBar.style.display = "none";
                if (loader) loader.style.display = "block";
            };

            function UnityProgress(instance, progress) {
                if (!instance || !instance.Module) return;

                var bar = document.querySelector("#loader .progress .full");

                if (progressBar) progressBar.style.display = "block";
                if (spinner) spinner.style.display = "none";

                if (bar) {
                    bar.style.transform = "scaleX(" + progress + ")";
                }

                if (message) {
                    message.textContent =
                        "Loading 1v1.LOL... " + Math.round(progress * 100) + "%";
                }

                if (progress >= 1) {
                    loaded = true;
                    window.gameLoaded = true;

                    if (loader) loader.style.display = "none";
                    if (timeoutId) clearTimeout(timeoutId);
                }
            }

            function startGame() {
                if (started) return;
                started = true;

                if (!window.UnityLoader ||
                    typeof window.UnityLoader.instantiate !== "function") {
                    window.showGameError(
                        "Unity loader failed. The alternative build may be unavailable."
                    );
                    return;
                }

                try {
                    if (message) message.textContent = "Connecting to game files...";

                    gameInstance = window.UnityLoader.instantiate(
                        "gameContainer",
                        gameJsonUrl,
                        { onProgress: UnityProgress }
                    );

                    window.unityInstance = gameInstance;

                    if (!gameInstance) {
                        window.showGameError(
                            "Unity did not create a game instance. Check the Console."
                        );
                        return;
                    }

                    timeoutId = setTimeout(function () {
                        if (!loaded) {
                            window.showGameError(
                                "The game has not finished loading. The alternative JSON or its Unity asset files may be unavailable. Check the Network tab for failed requests."
                            );
                        }
                    }, 60000);

                } catch (error) {
                    console.error("Unity startup error:", error);
                    window.showGameError(
                        "Unity startup failed: " + (error.message || error)
                    );
                }
            }

            document.addEventListener("keydown", function (event) {
                if (
                    event.altKey ||
                    event.ctrlKey ||
                    ["F1", "F2", "F3", "F4"].indexOf(event.key) !== -1
                ) {
                    event.preventDefault();
                }
            });

            document.addEventListener("pointerlockchange", function () {
                if (document.pointerLockElement) {
                    lockedOccured = true;
                } else if (lockedOccured) {
                    lockedOccured = false;

                    if (gameInstance &&
                        typeof gameInstance.SendMessage === "function") {
                        try {
                            gameInstance.SendMessage(
                                "Pause Menu",
                                "OnCursorUnlocked"
                            );
                        } catch (error) {
                            console.warn("Pause menu notification failed:", error);
                        }
                    }
                }
            });

            function adCommand(command) {
                if (typeof window.cpmstarAPI === "function") {
                    try {
                        window.cpmstarAPI(command);
                    } catch (error) {
                        console.warn("Ad request failed:", error);
                    }
                }
            }

            function injectAdByWindowSize() {
                if (typeof window.cpmstarAPI !== "function") return;

                var smallScreen = window.innerHeight < 900;
                var element = document.querySelector(
                    smallScreen ? ".ad-rectangle-bottom" : ".ad-leaderboard-bottom"
                );

                if (!element || element.dataset.adInitialized) return;
                element.dataset.adInitialized = "true";

                adCommand({
                    kind: "go",
                    module: smallScreen ? "POOL 83025" : "POOL 85420",
                    config: {
                        conditions: {
                            target: { el: element, kind: "replace" }
                        }
                    }
                });
            }

            window.addEventListener("resize", injectAdByWindowSize);
            injectAdByWindowSize();

            var timeSinceRefresh = 0;
            var timeAdsVisible = 0;
            var counter = null;

            function startCounter() {
                timeSinceRefresh++;
                if (adsVisible) timeAdsVisible++;

                counter = setTimeout(startCounter, 1000);
            }

            function refreshAds() {
                if (timeSinceRefresh <= 30 || timeAdsVisible <= 2) return;

                adCommand({
                    kind: "adcmd",
                    module: "POOL 83023",
                    command: "refresh"
                });

                adCommand({
                    kind: "adcmd",
                    module: "POOL 85420",
                    command: "refresh"
                });

                timeSinceRefresh = 0;
                timeAdsVisible = 0;
            }

            window.showAds = function () {
                adsVisible = true;
                document.querySelectorAll(
                    ".ad-rectangle-bottom, .ad-leaderboard-bottom, #adRectangleUpper"
                ).forEach(function (element) {
                    element.style.display = "block";
                });

                if (!counter) startCounter();
            };

            window.hideAds = function () {
                adsVisible = false;
                document.querySelectorAll(
                    ".ad-rectangle-bottom, .ad-leaderboard-bottom, #adRectangleUpper"
                ).forEach(function (element) {
                    element.style.display = "none";
                });
            };

            window.onfocus = refreshAds;
            window.onblur = function () {
                adsVisible = false;
            };

            window.onUnityReady = function () {
                if (typeof window.checkAdBlock === "function") {
                    try { window.checkAdBlock(); }
                    catch (error) { console.warn(error); }
                }

                if (typeof window.sendConfig === "function") {
                    try { window.sendConfig(); }
                    catch (error) { console.warn(error); }
                }
            };

            window.addEventListener("load", startGame);

            // If load already fired, start immediately.
            if (document.readyState === "complete") startGame();
        })();
    </script>

    <!-- Firebase SDK -->
    <script src="./firebasejs/7.2.1/firebase-app.js"></script>
    <script src="./firebasejs/7.2.1/firebase-analytics.js"></script>

    <script>
        try {
            var hostname = window.location.hostname;

            if (
                hostname.indexOf("dev1v1") >= 0 ||
                hostname.indexOf("dev.1v1") >= 0 ||
                hostname.indexOf("test1v1") >= 0 ||
                hostname.indexOf("test.1v1") >= 0 ||
                hostname.indexOf("localhost") >= 0
            ) {
                if (typeof initializeFireBaseDev === "function") {
                    initializeFireBaseDev();
                }
            } else if (typeof initializeFireBase === "function") {
                initializeFireBase();
            }

            if (typeof initRemoteConfig === "function") {
                initRemoteConfig();
            }
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }
    </script>
