<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snow Rider 3D</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #142b3b;
      color: white;
    }

    header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: #183e55;
    }

    h1 {
      margin: 0;
      font-size: 18px;
    }

    button {
      padding: 9px 14px;
      border: 0;
      border-radius: 6px;
      background: #63b85b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    main {
      height: calc(100% - 54px);
      padding: 10px;
    }

    iframe {
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      border-radius: 8px;
      background: white;
    }

    .fallback {
      text-align: center;
      padding: 20px;
    }

    .fallback a {
      color: #a8ddff;
    }
  </style>
</head>
<body>
  <header>
    <h1>🏂 Snow Rider 3D</h1>
    <button id="fullscreen">Fullscreen</button>
  </header>

  <main id="game">
    <iframe
      id="gameFrame"
      src="https://www.hoodamath.com/games/snowrider3d.html"
      title="Snow Rider 3D"
      allow="fullscreen; autoplay"
      allowfullscreen>
    </iframe>
  </main>

  <script>
    const frame = document.getElementById("gameFrame");

    document.getElementById("fullscreen").addEventListener("click", async () => {
      try {
        if (frame.requestFullscreen) {
          await frame.requestFullscreen();
        }
      } catch (error) {
        alert("Fullscreen is unavailable in this browser.");
      }
    });
  </script>
</body>
</html>
